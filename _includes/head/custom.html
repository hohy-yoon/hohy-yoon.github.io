{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
</noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>
  <link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css">
</noscript>

<!-- Blank browser-tab icon -->
<link rel="icon" href="data:,">

<meta name="theme-color" content="var(--global-bg-color)">

<style>
  /* Space between the article citation and Abstract */
  .page__content p:has(+ details) {
    margin-bottom: 0.35em;
  }

  /* Space after each abstract dropdown */
  .page__content details {
    margin-top: 0;
    margin-bottom: 1em;
  }
</style>

<!-- end custom head snippets -->
